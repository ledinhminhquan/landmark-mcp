<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Landmark — ask a spreadsheet</title>
<style>
  :root {
    --bg: #0a0e14;
    --panel: #121821;
    --edge: #1e2836;
    --ink: #e6edf3;
    --dim: #8b9bb0;
    --ring: #37b6ff;
    --ring-soft: rgba(55, 182, 255, .18);
    --good: #4ade80;
    --warn: #fbbf24;
    --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 0;
  }
  @media (max-width: 860px) { body { grid-template-columns: 1fr; } }

  /* ── device ─────────────────────────────────────────────────────────── */
  .device {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2rem; padding: 3rem 2rem; position: relative;
  }
  .puck {
    width: 260px; height: 260px; border-radius: 50%;
    background: radial-gradient(circle at 50% 42%, #1b2532, #0d1219 70%);
    border: 1px solid var(--edge);
    display: grid; place-items: center; position: relative;
    box-shadow: 0 30px 60px -20px #000;
  }
  .ring {
    position: absolute; inset: 10px; border-radius: 50%;
    border: 3px solid transparent; transition: border-color .25s, box-shadow .25s;
  }
  .puck[data-state="listening"] .ring {
    border-color: var(--ring);
    box-shadow: 0 0 40px var(--ring-soft), inset 0 0 30px var(--ring-soft);
    animation: pulse 1.6s ease-in-out infinite;
  }
  .puck[data-state="thinking"] .ring {
    border-color: var(--warn);
    box-shadow: 0 0 30px rgba(251, 191, 36, .16);
    animation: spin 1.1s linear infinite;
    border-right-color: transparent; border-bottom-color: transparent;
  }
  .puck[data-state="speaking"] .ring {
    border-color: var(--good);
    box-shadow: 0 0 34px rgba(74, 222, 128, .16);
    animation: breathe 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.02); } }
  @media (prefers-reduced-motion: reduce) { .ring { animation: none !important; } }

  .puck .label {
    font-size: .72rem; letter-spacing: .22em; text-transform: uppercase;
    color: var(--dim); text-align: center; padding: 0 2rem;
  }
  .puck .label strong { display: block; font-size: 1.05rem; letter-spacing: 0;
    text-transform: none; color: var(--ink); margin-top: .6rem; font-weight: 500; }

  .controls { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; justify-content: center; }
  button {
    font: inherit; padding: .7rem 1.4rem; border-radius: 999px; cursor: pointer;
    background: var(--ring); color: #06121c; border: 0; font-weight: 600;
  }
  button.ghost { background: transparent; color: var(--dim); border: 1px solid var(--edge); font-weight: 400; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; }

  .hint { color: var(--dim); font-size: .85rem; text-align: center; max-width: 46ch; }
  .hint code { color: var(--ink); background: var(--panel); padding: .1rem .4rem; border-radius: 4px; }

  /* ── side panel ─────────────────────────────────────────────────────── */
  aside {
    background: var(--panel); border-left: 1px solid var(--edge);
    display: flex; flex-direction: column; min-height: 100vh;
  }
  @media (max-width: 860px) { aside { border-left: 0; border-top: 1px solid var(--edge); min-height: auto; } }

  .bar {
    padding: .9rem 1.1rem; border-bottom: 1px solid var(--edge);
    display: flex; align-items: center; gap: .6rem; flex-wrap: wrap;
    font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; color: var(--dim);
  }
  .pill {
    font-family: ui-monospace, SFMono-Regular, monospace; font-size: .72rem;
    padding: .18rem .5rem; border-radius: 4px; background: #0d131c; border: 1px solid var(--edge);
    color: var(--ink); text-transform: none; letter-spacing: 0;
  }
  .pill.good { color: var(--good); border-color: #1d3a2a; }
  .pill.warn { color: var(--warn); border-color: #3a3320; }
  .pill.bad  { color: var(--bad);  border-color: #3a2222; }

  .log { flex: 1; overflow-y: auto; padding: 1.1rem; display: flex; flex-direction: column; gap: .9rem; }
  .turn { display: flex; flex-direction: column; gap: .25rem; }
  .who { font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  .said { font-size: .92rem; }
  .turn.you .said { color: var(--ring); }
  .meta {
    font-family: ui-monospace, monospace; font-size: .72rem; color: var(--dim);
    border-left: 2px solid var(--edge); padding-left: .6rem; margin-top: .2rem;
  }
  .empty { color: var(--dim); font-size: .86rem; }
</style>
</head>
<body>

<main class="device">
  <div class="puck" id="puck" data-state="idle">
    <div class="ring"></div>
    <div class="label">
      Landmark
      <strong id="status">Connecting…</strong>
    </div>
  </div>

  <div class="controls">
    <button id="talk" disabled>Hold to ask</button>
    <button id="stop" class="ghost">Interrupt</button>
  </div>

  <p class="hint" id="hint">
    Try: <code>what do I have</code> · <code>describe it</code> ·
    <code>what's the total revenue</code> · <code>how do you know</code>
  </p>
</main>

<aside>
  <div class="bar">
    <span>Session</span>
    <span class="pill" id="proto">protocol —</span>
    <span class="pill" id="tools">— tools</span>
    <span class="pill" id="latency">— ms</span>
  </div>
  <div class="log" id="log">
    <p class="empty">Every line below is a real MCP call over Streamable HTTP. Nothing is cached locally.</p>
  </div>
</aside>

<script type="module">
import { McpClient, Voice, route, absorb, context } from './app.js';

const el = (id) => document.getElementById(id);
const puck = el('puck'), status = el('status'), log = el('log');
const talk = el('talk'), stop = el('stop');

const client = new McpClient();
const voice = new Voice();

const STATUS = { idle: 'Ready', listening: 'Listening…', thinking: 'Working…', speaking: 'Speaking', error: 'Say again?' };
function setState(s) {
  puck.dataset.state = s;
  status.textContent = STATUS[s] ?? s;
}

function addTurn(who, said, meta) {
  const wrap = document.createElement('div');
  wrap.className = `turn ${who === 'You' ? 'you' : ''}`;
  const w = document.createElement('div'); w.className = 'who'; w.textContent = who;
  const s = document.createElement('div'); s.className = 'said'; s.textContent = said;
  wrap.append(w, s);
  if (meta) {
    const m = document.createElement('div'); m.className = 'meta'; m.textContent = meta;
    wrap.append(m);
  }
  log.querySelector('.empty')?.remove();
  log.append(wrap);
  log.scrollTop = log.scrollHeight;
}

function showLatency(ms) {
  const pill = el('latency');
  pill.textContent = `${ms} ms`;
  pill.className = `pill ${ms < 200 ? 'good' : ms < 500 ? 'warn' : 'bad'}`;
}

/** One turn: route the utterance, call the tool, speak the server's sentence. */
async function handle(said) {
  addTurn('You', said);
  setState('thinking');

  const plan = route(said);
  if (plan.speak) {
    setState('speaking');
    addTurn('Landmark', plan.speak, 'no call — needed more from you first');
    voice.speak(plan.speak);
    return;
  }

  try {
    const payload = await client.call(plan.tool, plan.args);
    showLatency(client.lastLatencyMs);
    absorb(plan.tool, plan.args, payload);

    const spoken = payload.spoken ?? 'I could not put that into words.';
    const detail = [
      plan.tool,
      `${client.lastLatencyMs} ms`,
      payload.answer_id ? `answer ${payload.answer_id}` : null,
      payload.more_available ? 'more available — say "more"' : null,
    ].filter(Boolean).join(' · ');

    addTurn('Landmark', spoken, detail);
    setState('speaking');
    voice.speak(spoken);
  } catch (err) {
    const message = `Something went wrong reaching the table. ${err.message}`;
    addTurn('Landmark', message, 'transport error');
    setState('speaking');
    voice.speak('Something went wrong reaching the table. Try again in a moment.');
  }
}

/**
 * A scripted entry point, for two reasons that are both about reliability rather
 * than convenience: it lets the conversation be tested end to end without a
 * microphone, and it is the fallback if speech recognition misbehaves while a demo
 * is being filmed. It drives exactly the same path a spoken utterance takes.
 *
 *   await landmark.ask("what's the total revenue")
 *   await landmark.script(["describe it", "total revenue", "how do you know"])
 */
window.landmark = {
  ask: handle,
  async script(lines, gapMs = 400) {
    for (const line of lines) {
      await handle(line);
      await new Promise((r) => setTimeout(r, gapMs));
    }
  },
  get context() { return context; },
};

// ── speech wiring ──────────────────────────────────────────────────────────
let interim = '';
voice.onstate = (s) => { if (s !== 'idle' || puck.dataset.state === 'listening') setState(s); };
voice.onheard = (text, final) => {
  interim = text;
  if (final && text) handle(text);
};

talk.addEventListener('click', () => {
  if (!voice.listen()) {
    addTurn('Landmark', 'This browser has no speech recognition. Chrome does.', 'falling back to typing');
    const typed = prompt('Ask a question:');
    if (typed) handle(typed);
  }
});

stop.addEventListener('click', () => {
  // Barge-in: a real voice user interrupts a long answer rather than waiting it out.
  voice.stopSpeaking();
  voice.stopListening();
  setState('idle');
});

// Space bar as push-to-talk, so a demo can be driven without looking at the screen.
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !e.repeat && document.activeElement === document.body) {
    e.preventDefault();
    talk.click();
  }
});

// ── connect ────────────────────────────────────────────────────────────────
(async () => {
  try {
    const info = await client.connect();
    el('proto').textContent = `protocol ${info.protocolVersion}`;
    el('proto').className = `pill ${info.protocolVersion === '2025-11-25' ? 'good' : 'bad'}`;
    el('tools').textContent = `${client.tools.length} tools`;
    showLatency(client.lastLatencyMs);
    talk.disabled = false;
    setState('idle');
    addTurn(
      'Landmark',
      `Connected to ${info.serverInfo.name} ${info.serverInfo.version}.`,
      `${client.tools.length} tools · protocol ${info.protocolVersion}`,
    );
    if (!voice.supported) {
      addTurn('Landmark', 'Speech is unavailable in this browser; the buttons still work.', 'Chrome supports Web Speech');
    }
    // Open on something useful rather than an empty shell.
    await handle('what do I have');
  } catch (err) {
    setState('error');
    status.textContent = 'Offline';
    addTurn('Landmark', `Could not reach the table service. ${err.message}`, 'is npm run serve running?');
  }
})();
</script>
</body>
</html>
