# Runs the whole suite on the three systems a judge is likely to clone onto, and on the
# oldest Node that package.json promises. Every other check in this repository ran on one
# Windows laptop; this is the evidence that "npm ci && npm test" works anywhere else.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.x', '24.x']
        include:
          # The floor in package.json "engines". 22.6.0, the first release with type
          # stripping, cannot parse a typed private field (`#answers = new Map<…>()`);
          # 22.7.0 through 22.18.0 were each checked and pass.
          - os: ubuntu-latest
            node: '22.7.0'
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
